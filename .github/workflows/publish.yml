name: Publish to Open VSX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Verify tag matches package version
        run: node -e 'const { version } = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error(`Tag must be v${version}`)'

  publish-open-vsx:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Publish to Open VSX for Cursor
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VSIX="diff-chooser-$(node -p 'require("./package.json").version').vsix"
          npx ovsx publish "$VSIX" -p "$OVSX_PAT"
